syntax = "proto3";

option go_package = ".;link";

package link;


service ChatService{
    rpc ChatStream (stream ChatRequest) returns (stream ChatResponse);
}

message ChatRequest{
    string wspId=1;
    string threadId =2;
    string request = 3;
}

message ChatResponse{
    string threadId = 1;
    string wspID = 2;
    string response = 3;
    string trace = 4;
}